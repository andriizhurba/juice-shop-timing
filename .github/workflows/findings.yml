name: Findings - collect reports

on:
  workflow_dispatch:

jobs:
  findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Dependency-Check cache
        uses: actions/cache@v4
        with:
          path: ~/odc-data
          key: odc-${{ github.run_id }}
          restore-keys: odc-

      - name: Build Docker image
        run: docker build -t juice-shop:test .

      - name: Gitleaks
        run: |
          mkdir -p ~/reports
          docker run --rm \
            -v "$PWD":/path \
            -v $HOME/reports:/reports \
            ghcr.io/gitleaks/gitleaks:latest dir /path --exit-code 0 \
            --report-format json --report-path /reports/gitleaks.json

      - name: Trivy
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/trivy \
            -v $HOME/reports:/reports \
            aquasec/trivy:0.72.0 image --exit-code 0 \
            --format json --output /reports/trivy.json juice-shop:test

      - name: Generate lock files
        run: |
          npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund --prefix frontend

      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/odc-data ~/reports
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/src \
            -v $HOME/odc-data:/usr/share/dependency-check/data \
            -v $HOME/reports:/report \
            owasp/dependency-check:latest \
            --scan /src --exclude "**/test/**" --format HTML --format JSON \
            --project juice-shop --out /report \
            --nvdApiKey "$NVD_API_KEY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: /home/runner/reports